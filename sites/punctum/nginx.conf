server {
    listen 8080;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }
    error_page 404 /404.html;

    # assets: short cache so updates land quickly; HTML never cached
    location /assets/ {
        root /usr/share/nginx/html;
        expires 10m;
        add_header Cache-Control "public, max-age=600";
    }
    location = /index.html {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }
}