server {
    listen 80;
    server_name snapotter.pompui.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name snapotter.pompui.de;

    # Provider (IONOS/Sectigo) wildcard certificate *.pompui.de
    ssl_certificate /etc/nginx/ssl/fullchain-pompui.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-pompui.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # Security Headers
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # SnapOtter serves its own CSP / X-Frame-Options; don't override.

    # File uploads / downloads through the app can be large.
    client_max_body_size 2048m;
    client_body_timeout 300s;

    # Disable proxy buffering for streamed file processing.
    proxy_buffering off;

    # Websocket / SSE support
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";

    location / {
        proxy_pass http://pompui-snapotter:1349;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300;
        proxy_send_timeout 300;
    }
}