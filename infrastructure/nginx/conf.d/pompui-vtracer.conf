server {
    listen 80;
    server_name vtracer.pompui.de;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name vtracer.pompui.de;

    # Provider (IONOS/Sectigo) wildcard certificate *.pompui.de
    ssl_certificate /etc/nginx/ssl/fullchain-pompui.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey-pompui.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer-when-downgrade" always;

    # The app processes images fully client-side (wasm in the browser);
    # uploads only go as far as the user's own clipboard/disk. Keep CSP
    # self-contained: wasm needs 'wasm-unsafe-eval' in script-src.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data:; media-src 'self' blob:; connect-src 'self' blob: data:; font-src 'self' data:; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    limit_req zone=general burst=20 nodelay;

    # Converted files are generated client-side; requests are small, but
    # allow generous uploads anyway (large rasters dropped into the UI).
    client_max_body_size 64m;

    # Inject the shared POMPUI chrome (AI badge + Home button) into VTracer's
    # HTML. sub_filter only rewrites text/html responses.
    proxy_set_header Accept-Encoding "";
    sub_filter '</body>' '<link rel="stylesheet" href="https://pompui.de/shared/pompui-chrome.css" /><script src="https://pompui.de/shared/pompui-chrome.js" defer></script></body>';
    sub_filter_once on;

    location / {
        proxy_pass http://pompui-vtracer:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}